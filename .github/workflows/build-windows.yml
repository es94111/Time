# 建置 Windows 安裝檔（Tauri 2）
# 產出：target/release/bundle/nsis/*.exe（NSIS 安裝檔）
# - push main / PR：僅建置並上傳 Artifact 供下載驗證
# - 推送 v* 標籤：另外建立 GitHub Release（草稿），附上安裝檔
name: 建置 Windows 安裝檔

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 建立 Release 需要寫入內容的權限
permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: 建置（windows-2022）
    # Tauri NSIS bundling requires makensis. Pin Windows 2022 because
    # windows-latest moved to Windows Server 2025 and that image no longer
    # includes NSIS by default.
    runs-on: windows-2022
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Rust 穩定版
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 相依快取
        uses: Swatinem/rust-cache@v2
        with:
          # 用戶端 workspace 位於 repo 根目錄
          workspaces: '. -> target'

      - name: 安裝 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安裝前端相依
        run: npm ci
        working-directory: ui

      # tauri-action 會執行 tauri.conf.json 的 beforeBuildCommand
      # （npm --prefix ../ui run build）以建置前端，接著建置 Windows exe
      - name: 建置 Tauri（Windows exe / NSIS 安裝檔）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 僅在推送 v* 標籤時建立 Release，否則留空只做建置
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: '活動追蹤器 ${{ github.ref_name }}'
          releaseDraft: true
          releaseBody: '本安裝檔由 GitHub Actions 自動建置產生。'

      - name: 上傳安裝檔為 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
