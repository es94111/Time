# 安全掃描與漏洞檢查
# 涵蓋四個面向：
#   1. cargo-audit：比對 RUSTSEC 漏洞資料庫（用戶端 + 伺服器兩個 Cargo.lock）
#   2. gitleaks：掃描原始碼與歷史紀錄中的機密（金鑰、密碼、token）
#   3. CodeQL：前端 TypeScript 靜態程式分析（SAST）
#   4. Trivy：檔案系統相依與設定檔漏洞掃描（含 server/Dockerfile）
# 註：本儲存庫為私有且未啟用 GitHub Advanced Security，無法上傳 SARIF 至
#     Security 分頁；CodeQL 與 Trivy 結果改以 workflow artifact 保存。
#     若日後公開儲存庫或啟用 GHAS，可改回 github/codeql-action/upload-sarif。
name: 安全掃描與漏洞檢查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # 每週一 03:00 UTC 定期重掃（新披露的漏洞）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Rust 相依漏洞稽核（RUSTSEC）
  cargo-audit:
    name: Cargo 漏洞稽核（${{ matrix.name }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 用戶端
            lockfile: Cargo.lock
            # 用戶端目前無需忽略項目
            ignores: ''
          - name: 伺服器
            lockfile: server/Cargo.lock
            # 忽略清單（皆為鎖檔中「未啟用功能」的選用相依，實際不會編譯進成品）：
            #   RUSTSEC-2023-0071：rsa（經 sqlx-mysql 引入；本專案僅啟用 postgres 功能，且上游無修復版）
            #   RUSTSEC-2026-0098/0099/0104：rustls-webpki 0.101（經 aws-smithy-http-client
            #     的 legacy rustls 0.21「選用」功能引入；實際編譯使用的是 rustls 0.23 鏈）
            ignores: >-
              --ignore RUSTSEC-2023-0071
              --ignore RUSTSEC-2026-0098
              --ignore RUSTSEC-2026-0099
              --ignore RUSTSEC-2026-0104
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v5

      - name: 安裝 Rust 穩定版
        uses: dtolnay/rust-toolchain@stable

      - name: 安裝 cargo-audit
        run: cargo install cargo-audit --locked

      # 不使用 --deny warnings：Tauri 的 Linux GTK3 綁定（atk/gdk/gtk 等）上游已標記
      # 無人維護且暫無替代版本，僅列為警告供日誌追蹤；真正的漏洞（vulnerability）仍會使工作失敗。
      - name: 執行漏洞稽核
        run: cargo audit --file ${{ matrix.lockfile }} ${{ matrix.ignores }}

  # 2. 機密掃描
  gitleaks:
    name: 機密掃描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼（含完整歷史）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 歷史紀錄中已知且已處理的項目列於 .gitleaksignore（指紋格式：commit:檔案:規則:行號）
      - name: 執行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. 前端靜態程式分析（SAST）
  codeql:
    name: CodeQL 靜態分析（前端）
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v5

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # 私有庫未啟用 GHAS：upload: never 跳過 Security 分頁上傳，改存 artifact
      - name: 執行分析
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
          upload: never
          output: codeql-results

      - name: 保存 CodeQL 結果（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results

  # 4. 檔案系統相依與設定漏洞掃描
  trivy:
    name: Trivy 相依與設定掃描
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v5

      - name: 執行 Trivy（檔案系統）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: 保存 Trivy 結果（artifact）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
