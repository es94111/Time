# Dependabot：自動追蹤相依套件的安全更新與版本升級
# 涵蓋：用戶端 Cargo workspace、伺服器 Cargo workspace、前端 npm、GitHub Actions
version: 2
updates:
  # 用戶端 Rust workspace（repo 根目錄）
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ['dependencies', 'rust']

  # 伺服器 Rust workspace
  - package-ecosystem: cargo
    directory: '/server'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ['dependencies', 'rust', 'server']

  # 前端 npm
  - package-ecosystem: npm
    directory: '/ui'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ['dependencies', 'frontend']

  # GitHub Actions 工作流程本身
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['dependencies', 'ci']
