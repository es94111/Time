# 本機開發／自架部署範例（quickstart.md）：server + postgres + minio。
# 正式環境可將 postgres/minio 改指向受管服務；TLS 終止交由外部反向代理（research.md R9）。

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 啟用單金鑰 SSE-S3 自動加密（無外部 KMS 時之最小可用設定），
      # 對應 server/src/storage/s3.rs 寫入時要求的伺服器端加密（research.md R11）。
      # 金鑰改由環境變數注入（複製 .env.example 為 .env 後填入），避免明文入庫；
      # 正式環境請改用外部 KMS。
      MINIO_KMS_SECRET_KEY: "${MINIO_KMS_SECRET_KEY:?請於 server/.env 設定 MINIO_KMS_SECRET_KEY（產生方式見 .env.example）}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  server:
    build: .
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgres://tracker:tracker@postgres:5432/tracker
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tracker-snapshots
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SESSION_SIGNING_KEY: dev-only-change-me
      DEFAULT_RETENTION_DAYS: "90"
    ports:
      - "8080:8080"
    # 正式環境應於此服務前掛載反向代理（Caddy/Nginx）處理 TLS（research.md R9）。

volumes:
  postgres_data:
  minio_data:
