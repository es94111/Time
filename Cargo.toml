# Cargo workspace 根（活動追蹤器）
# 多 crate：純領域邏輯（tracker-core）／Windows 平台整合（tracker-platform）／
# 加密儲存（tracker-storage）／Tauri 應用（src-tauri）。
[workspace]
resolver = "2"
members = [
    "crates/tracker-core",
    "crates/tracker-platform",
    "crates/tracker-storage",
    "crates/tracker-sync",
    "src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Activity Tracker"]

# 共用相依（版本集中管理；實作時以 cargo add / cargo update 取最新穩定版）。
[workspace.dependencies]
# 序列化與資料
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
thiserror = "2"
# 時間（時區感知、午夜切分、DST）
jiff = { version = "0.2", features = ["serde"] }
# URL → 主機名解析
url = "2.5"
# 加密與金鑰
argon2 = "0.5"
aes-gcm = "0.11"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
# 加密 SQLite（SQLCipher，bundled 含 OpenSSL，免裝系統 OpenSSL）
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# 用戶端與遠端伺服器 HTTPS 通訊（research.md R7；非 Windows 原廠元件，見 Complexity Tracking）
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
# Microsoft 官方 Windows API 綁定
windows = "0.62"
windows-core = "0.62"
# Tauri 2
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# 內部 crate
tracker-core = { path = "crates/tracker-core" }
tracker-platform = { path = "crates/tracker-platform" }
tracker-storage = { path = "crates/tracker-storage" }
tracker-sync = { path = "crates/tracker-sync" }

[profile.release]
opt-level = "s"   # 體積優先（低資源佔用，原則 IV）
lto = true
codegen-units = 1
strip = true
panic = "abort"
